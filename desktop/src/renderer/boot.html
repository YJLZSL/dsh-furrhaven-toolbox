<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Furrhaven Studio</title>
  <link rel="stylesheet" href="boot.css" />
  <link rel="stylesheet" href="window-controls.css" />
</head>
<body data-state="starting">
  <div class="caption" aria-hidden="true"></div>
  <div class="window-controls"></div>
  <main class="stage">
    <div class="mark" aria-hidden="true">
      <span class="ring"></span>
      <svg viewBox="0 0 48 48" role="img">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e8c87e"/>
            <stop offset=".5" stop-color="#b8860b"/>
            <stop offset="1" stop-color="#8a6a1f"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="21" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
        <circle cx="24" cy="24" r="15.5" fill="none" stroke="url(#gold)" stroke-width=".7" opacity=".55"/>
        <path d="M16 21c0-6 3.5-9.5 8-9.5s8 3.5 8 9.5c0 4-2 6.5-4 7.5-1.2-1.5-2.6-1.6-4-1.6s-2.8.1-4 1.6c-2-1-4-3.5-4-7.5z" fill="url(#gold)" opacity=".95"/>
        <path d="M24 8.5c2.8 0 4.2 1.4 4.6 3.6-1.4-.9-2.9-1.4-4.6-1.5z" fill="#fff" opacity=".5"/>
        <path d="M9 33.5c1.6-3.4 4.2-4.8 7.8-4.2M39 33.5c-1.6-3.4-4.2-4.8-7.8-4.2" stroke="url(#gold)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <circle cx="24" cy="27" r="2.2" fill="#f7f1e5"/>
      </svg>
    </div>
    <p class="brand">Furrhaven Studio</p>
    <p class="status" id="status" role="status">正在启动 DSH 运行时</p>
    <p class="hint" id="hint">正在启动本机 dsh web；关闭应用时会一并退出服务。</p>
    <div class="actions" id="actions" hidden>
      <button type="button" id="retry">重试</button>
    </div>
    <ol class="log" id="log" aria-label="最近日志" aria-live="polite"></ol>
  </main>
  <script src="theme.js"></script>
  <script src="window-controls.js"></script>
  <script src="boot.js"></script>
</body>
</html>
