name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install engine
        run: python -m pip install -e ./furrhaven-core pytest
      - name: Engine tests
        run: python -m pytest furrhaven-core/tests -q
      - name: Engine selftest
        run: fh check --selftest

  preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preset tests
        working-directory: dsh/preset/card-forge
        run: node --test test/*.test.mjs
