[package]
name = "furrhaven-studio"
version = "0.1.0"
description = "Furrhaven Studio — 角色卡多平台写卡桌面工作室"
authors = ["Furrhaven Toolbox contributors"]
edition = "2021"

[lib]
name = "furrhaven_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
