- id: fc-v23-01
  name: 隐藏系统注释
  find: <!--(?!\s*(?:Node\|好感度)\s*[:：])[\s\S]*?-->
  replace: ''
  flags:
  - DOTALL
  scope: ai_reply
  order: 1
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-02
  name: VN系统信息展示
  find: <!--\s*(Node\|好感度)\s*[:：]\s*([\s\S]*?)\s*-->
  replace: '<div style="font-size:0.72em;color:rgba(184,134,11,0.85);text-align:left;padding:2px
    0;margin:2px 0">✦ 当前$1: $2</div>'
  flags:
  - DOTALL
  scope: ai_reply
  order: 2
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-03
  name: VN时间地点栏
  find: ^`?(\d{4}/\d{1,2}/\d{1,2}\s+\d{1,2}:\d{2})`?$
  replace: <div style="text-align:center;color:rgba(139,115,85,0.70);font-size:0.78em;padding:4px
    0 6px;border-bottom:1px solid rgba(139,115,85,0.30);margin-bottom:8px">$1</div>
  flags:
  - MULTILINE
  scope: ai_reply
  order: 3
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-04
  name: 自动加粗对话
  find: ^>\s*[“\"]([^”\"\n]+?)[”\"](.*)$
  replace: <div style="font-weight:600;color:rgba(74,55,40,0.85);padding:2px 0">$1</div>$2
  flags:
  - MULTILINE
  scope: ai_reply
  order: 4
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-05
  name: 叙述文本着色
  find: ^>([^“\"\n].*)$
  replace: <div style="padding-left:6px;color:rgba(74,55,40,0.85);border-left:2px
    solid rgba(139,115,85,0.80);margin:2px 0;line-height:1.6">$1</div>
  flags:
  - MULTILINE
  scope: ai_reply
  order: 5
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-06
  name: VN选项标题
  find: \*\*【请选择[您你]的行动】\*\*
  replace: <div style="text-align:center;color:rgba(139,115,85,0.80);font-size:0.85em;margin:14px
    0 8px;padding:5px 0;border-top:1px solid rgba(139,115,85,0.30);border-bottom:1px
    solid rgba(139,115,85,0.30);font-weight:600">✦ 请选择您的行动</div>
  flags: []
  scope: ai_reply
  order: 6
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-07
  name: VN选项卡片（1-3）
  find: \*\*([1-3])\.\s*(.+?)\*\*
  replace: <div style="border:1px solid rgba(139,115,85,0.35);border-radius:8px;padding:10px
    16px;margin:5px 0;color:rgba(74,55,40,0.85);font-size:0.93em">$1. $2</div>
  flags: []
  scope: ai_reply
  order: 7
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-08
  name: VN选项卡片（4-自由输入）
  find: \*\*4\.\s*(.+?)\*\*
  replace: <div style="border:1px dashed rgba(139,115,85,0.35);border-radius:8px;padding:10px
    16px;margin:5px 0;color:rgba(139,115,85,0.65);font-size:0.93em;font-style:italic"><Spoilers>$1</Spoilers></div>
  flags: []
  scope: ai_reply
  order: 8
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-09
  name: 选项栏分隔线
  find: ^---$
  replace: <svg style="display:block;width:100%;height:1px;margin:12px 0" viewBox="0
    0 100 1" preserveAspectRatio="none"><line x1="0" y1="0.5" x2="100" y2="0.5" stroke="rgba(139,115,85,0.50)"
    stroke-width="1" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100"><animate
    attributeName="stroke-dashoffset" from="100" to="0" dur="0.5s" fill="freeze" calcMode="spline"
    keySplines="0.22 0.61 0.36 1" keyTimes="0;1"/></line></svg>
  flags:
  - MULTILINE
  scope: ai_reply
  order: 9
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-10
  name: 动作描写着色
  find: (?<!\*)\*(?!\*)([^*\n]+?)(?<!\*)\*(?!\*)
  replace: <div style="color:rgba(184,134,11,0.75);font-style:italic;margin:6px 0;padding-left:8px;border-left:2px
    solid rgba(139,115,85,0.30);line-height:1.7">$1</div>
  flags: []
  scope: ai_reply
  order: 10
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-11
  name: 关键词高亮（已禁用）
  find: (placeholder)
  replace: $1
  flags: []
  scope: ai_reply
  order: 11
  enabled: false
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-12
  name: 状态面板
  find: <态>([\s\S]*?)<\/态>
  replace: <div style="border-left:3px solid rgba(184,134,11,0.85);padding:8px 12px;margin:4px
    0;font-size:0.88em;line-height:1.5;color:rgba(74,55,40,0.85);white-space:pre-line"><div
    style="color:rgba(184,134,11,0.85);font-weight:600;font-size:0.85em;margin-bottom:4px">✦
    状态</div>$1</div>
  flags:
  - DOTALL
  scope: ai_reply
  order: 12
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-13
  name: 场景转换标记
  find: ^===$
  replace: <div style="text-align:center;margin:16px 0;padding:8px 0;color:rgba(139,115,85,0.50);font-size:0.75em;letter-spacing:3px">✦
    ✦ ✦</div>
  flags:
  - MULTILINE
  scope: ai_reply
  order: 13
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-14
  name: Memory记忆面板
  find: <Memory(?:\s[^>]*)?>([\s\S]*?)<\/Memory>
  replace: <details style="border:1px solid rgba(184,134,11,0.45);border-radius:8px;padding:8px
    12px;margin:6px 0;font-size:0.85em;background:rgba(184,134,11,0.05);color:rgba(74,55,40,0.85)"><summary
    style="cursor:pointer;color:rgba(184,134,11,0.85);font-weight:600;font-size:0.85em">✦
    记忆</summary><div style="white-space:pre-line;line-height:1.6;margin-top:6px">$1</div></details>
  flags:
  - DOTALL
  scope: ai_reply
  order: 14
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
- id: fc-v23-15
  name: 全匹配-全局样式容器
  find: ^([\s\S]+)$
  replace: <div style="font-family:'Noto Serif CJK SC','Noto Serif SC','Source Han
    Serif SC','STSong','SimSun','Georgia','Times New Roman',serif;line-height:1.8;color:rgba(74,55,40,0.85);letter-spacing:0.02em">$1</div>
  flags:
  - DOTALL
  scope: ai_reply
  order: 15
  enabled: true
  dialect: fc
  notes: FC 统一渲染 v2.3 模板包（自参考项目迁移）
